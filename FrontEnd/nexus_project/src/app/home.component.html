<main class="home-page">
  <section class="home-header">
    <div>
      <p class="eyebrow">N.E.X.U.S. / HOME</p>
      <h1>Bienvenido{{ auth.user()?.first_name ? ', ' + auth.user()?.first_name : '' }}</h1>
      <p>Tu contexto de autenticacion esta activo.</p>
    </div>
    <button type="button" (click)="logout()" title="Cerrar sesion">Cerrar sesion</button>
  </section>

  <section class="role-panel" aria-label="Informacion de acceso">
    <span>Rol actual</span>
    <strong>{{ auth.user()?.rol }}</strong>
    <p>{{ auth.user()?.email }}</p>
  </section>
</main>
