<div class="modal-container">
  <h2 mat-dialog-title>Acuerdos en Seguimiento</h2>
  <mat-dialog-content class="mat-elevation-z8">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort matSortActive="fecha_limite" matSortDirection="asc">
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
          <td mat-cell *matCellDef="let acuerdo">{{ acuerdo.descripcion }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
          <td mat-cell *matCellDef="let acuerdo">{{ acuerdo.estado }}</td>
        </ng-container>

        <ng-container matColumnDef="fecha_limite">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha Límite</th>
          <td mat-cell *matCellDef="let acuerdo">{{ acuerdo.fecha_limite | date:'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="responsable">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Responsable</th>
          <td mat-cell *matCellDef="let acuerdo">{{ acuerdo.responsable }}</td>
        </ng-container>

        <ng-container matColumnDef="estudiante">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Estudiante</th>
          <td mat-cell *matCellDef="let acuerdo">{{ acuerdo.estudiante }}</td>
        </ng-container>

        <ng-container matColumnDef="matricula">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Matrícula</th>
          <td mat-cell *matCellDef="let acuerdo">{{ acuerdo.matricula }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="onNoClick()">Cerrar</button>
  </mat-dialog-actions>
</div>
