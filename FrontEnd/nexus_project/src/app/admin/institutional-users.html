<main class="page-shell">
  <header class="page-header">
    <h1>Cuentas institucionales</h1>
    <p>Crea cuentas para asesores, miembros del comité y coordinadores académicos.</p>
  </header>

  <section class="nexus-card form-card" aria-labelledby="account-heading">
    <div class="section-header">
      <h2 id="account-heading">Nueva cuenta</h2>
      <p>Completa los datos de acceso y asigna el rol inicial.</p>
    </div>

    <form #userForm="ngForm" (ngSubmit)="createUser()">
      <label>
        Nombre
        <input class="input-field" name="first_name" [(ngModel)]="form.first_name" (keydown)="bloquearNumeros($event)" (input)="filtrarNumeros($event, 'first_name')" pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$" title="Solo se permiten letras y espacios" required>
      </label>
      <label>
        Apellidos
        <input class="input-field" name="last_name" [(ngModel)]="form.last_name" (keydown)="bloquearNumeros($event)" (input)="filtrarNumeros($event, 'last_name')" pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$" title="Solo se permiten letras y espacios" required>
      </label>
      <label>
        Correo institucional
        <input class="input-field" name="email" type="email" [(ngModel)]="form.email" required>
      </label>
      <label>
        Contraseña temporal
        <div class="password-field-wrapper">
          <input class="input-field" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="form.password" required>
          <button type="button" class="btn-toggle-password" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            @if (showPassword) {
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </label>
      <label class="role-field">
        Rol
        <select class="input-field" name="role" [(ngModel)]="form.role">
          @for (role of roles; track role) { <option [value]="role">{{ getRoleLabel(role) }}</option> }
        </select>
      </label>
      <div class="form-actions">
        <button class="btn-primary" type="submit" [disabled]="saving || userForm.invalid">
          {{ saving ? 'Creando...' : 'Crear cuenta' }}
        </button>
      </div>
    </form>
  </section>

  @if (message) { <p class="feedback feedback-success" role="status">{{ message }}</p> }
  @if (error) { <p class="feedback feedback-error" role="alert">{{ error }}</p> }
</main>
