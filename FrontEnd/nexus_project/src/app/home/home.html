<main class="home-shell">
  <header>
    <div>
      <div class="brand-badge">
        <svg class="nexus-brand-icon" viewBox="0 0 12 10" width="14" height="12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.98125 3.0625l1.54583-3.0625 0.175 0 1.54584 3.0625-3.26667 0 0 0m1.19583 6.9125l-5.03125-6.0375 5.03125 0 0 6.0375 0 0m0.875 0l0-6.0375 5.03125 0-5.03125 6.0375 0 0m2.15834-6.9125l-1.51667-3.0625 3.00417 0 1.53125 3.0625-3.01875 0 0 0m-8.21042 0l1.53125-3.0625 3.00417 0-1.51667 3.0625-3.01875 0 0 0" fill="#494AD5"/>
        </svg>
        <span>N.E.X.U.S.</span>
      </div>
      <h1>Inicio</h1>
    </div>
    <button class="logout-btn" type="button" (click)="logout()" [disabled]="isLeaving">
      {{ isLeaving ? 'Cerrando sesión...' : 'Cerrar sesión' }}
    </button>
  </header>

  @if (auth.user(); as user) {
  <section aria-label="Informacion de sesion">
    <p>Bienvenido, {{ user.first_name || user.email }}.</p>
    <p class="role">Rol: {{ user.role }}</p>
  </section>
  }
</main>
